name: CI

on:
  pull_request:
  push:
    branches: [main, revamp]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Unit tests
        run: npm test

      - name: Typecheck and build
        run: npm run build
        env:
          VITE_FIREBASE_API_KEY: ci-placeholder
          VITE_FIREBASE_AUTH_DOMAIN: ci-placeholder.firebaseapp.com
          VITE_FIREBASE_PROJECT_ID: ci-placeholder
          VITE_FIREBASE_APP_ID: "1:000000000000:web:ci000000000000"
          VITE_API_BASE_URL: http://localhost:8000
          VITE_APP_ENV: development

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build the web image
        run: |
          docker build -t travely-web \
            --build-arg VITE_FIREBASE_API_KEY=ci-placeholder \
            --build-arg VITE_FIREBASE_AUTH_DOMAIN=ci-placeholder.firebaseapp.com \
            --build-arg VITE_FIREBASE_PROJECT_ID=ci-placeholder \
            --build-arg VITE_FIREBASE_APP_ID=1:000000000000:web:ci000000000000 \
            --build-arg VITE_API_BASE_URL=http://localhost:8000 .

      - name: Serve it and check the health and app routes
        run: |
          docker run -d --name web -p 8080:8080 travely-web
          sleep 3
          curl -fsS http://localhost:8080/healthz
          curl -fsS -o /dev/null http://localhost:8080/app/trips
